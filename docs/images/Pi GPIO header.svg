<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1130" viewBox="0 0 1280 1130" role="img" aria-label="EyeCar / Raspberry Pi 4 GPIO"><title>EyeCar / Raspberry Pi 4 GPIO</title><defs><marker id="075b91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#075b91"/></marker><marker id="237f79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237f79"/></marker><marker id="b64336" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b64336"/></marker></defs><rect width="1280" height="1130" fill="#f6f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="32" fill="#075b91" text-anchor="start" font-weight="bold">EyeCar / Raspberry Pi 4 GPIO</text><text x="40" y="90" font-size="18" fill="#182c3a" text-anchor="start" font-weight="normal">BCM signal identifiers and physical header positions are shown separately.</text><path d="M40 116H1240" stroke="#075b91" stroke-width="2"/><rect x="530" y="170" width="220" height="800" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="548" y="201" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">40-pin header</text><rect x="40" y="190" width="270" height="170" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="221" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Pi 4 Model B power</text><text x="58" y="252" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">USB-C from regulated 5V.</text><text x="58" y="277" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Supply target: 3A for Pi 4.</text><text x="58" y="302" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">5V header pins are shown</text><text x="58" y="327" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">for reference, not used here.</text><rect x="40" y="460" width="270" height="145" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="491" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">USB connections</text><text x="58" y="522" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Pi USB-A to Mega USB-B.</text><text x="58" y="547" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Camera to another USB port.</text><text x="58" y="572" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">No GPIO UART cable.</text><rect x="40" y="720" width="270" height="160" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="751" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Numbering</text><text x="58" y="782" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">12: physical header position.</text><text x="58" y="807" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">GPIO18: BCM identifier.</text><text x="58" y="832" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">13: LED pixel count.</text><text x="58" y="857" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">These are different numbers.</text><rect x="980" y="310" width="260" height="185" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="998" y="341" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">LED data</text><text x="998" y="372" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Pin 12 / BCM GPIO18</text><text x="998" y="397" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">3.3V to 5V logic buffer</text><text x="998" y="422" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">then strip DIN.</text><text x="998" y="447" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">See overview diagram.</text><rect x="980" y="620" width="260" height="160" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="998" y="651" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Common ground</text><text x="998" y="682" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Use pin 6 for GND.</text><text x="998" y="707" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">To LED supply GND.</text><text x="998" y="732" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Other header GND pins</text><text x="998" y="757" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">are the same ground.</text><circle cx="575" cy="235" r="13" fill="#b64336"/><text x="575" y="240" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="510" y="241" font-size="17" fill="#b64336" text-anchor="end" font-weight="normal">3V3</text><circle cx="705" cy="235" r="13" fill="#b64336"/><text x="705" y="240" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="770" y="241" font-size="17" fill="#b64336" text-anchor="start" font-weight="normal">5V</text><circle cx="575" cy="271" r="13" fill="#075b91"/><text x="575" y="276" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="510" y="277" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO2 / SDA1</text><circle cx="705" cy="271" r="13" fill="#b64336"/><text x="705" y="276" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="770" y="277" font-size="17" fill="#b64336" text-anchor="start" font-weight="normal">5V</text><circle cx="575" cy="307" r="13" fill="#075b91"/><text x="575" y="312" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="510" y="313" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO3 / SCL1</text><circle cx="705" cy="307" r="13" fill="#586976"/><text x="705" y="312" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">6</text><text x="770" y="313" font-size="17" fill="#586976" text-anchor="start" font-weight="normal">GND</text><circle cx="575" cy="343" r="13" fill="#075b91"/><text x="575" y="348" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">7</text><text x="510" y="349" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO4</text><circle cx="705" cy="343" r="13" fill="#075b91"/><text x="705" y="348" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">8</text><text x="770" y="349" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO14 / TXD0</text><circle cx="575" cy="379" r="13" fill="#586976"/><text x="575" y="384" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">9</text><text x="510" y="385" font-size="17" fill="#586976" text-anchor="end" font-weight="normal">GND</text><circle cx="705" cy="379" r="13" fill="#075b91"/><text x="705" y="384" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">10</text><text x="770" y="385" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO15 / RXD0</text><circle cx="575" cy="415" r="13" fill="#075b91"/><text x="575" y="420" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">11</text><text x="510" y="421" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO17</text><circle cx="705" cy="415" r="13" fill="#237f79"/><text x="705" y="420" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">12</text><text x="770" y="421" font-size="17" fill="#237f79" text-anchor="start" font-weight="bold">GPIO18 / LED</text><circle cx="575" cy="451" r="13" fill="#075b91"/><text x="575" y="456" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">13</text><text x="510" y="457" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO27</text><circle cx="705" cy="451" r="13" fill="#586976"/><text x="705" y="456" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">14</text><text x="770" y="457" font-size="17" fill="#586976" text-anchor="start" font-weight="normal">GND</text><circle cx="575" cy="487" r="13" fill="#075b91"/><text x="575" y="492" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">15</text><text x="510" y="493" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO22</text><circle cx="705" cy="487" r="13" fill="#075b91"/><text x="705" y="492" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">16</text><text x="770" y="493" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO23</text><circle cx="575" cy="523" r="13" fill="#b64336"/><text x="575" y="528" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">17</text><text x="510" y="529" font-size="17" fill="#b64336" text-anchor="end" font-weight="normal">3V3</text><circle cx="705" cy="523" r="13" fill="#075b91"/><text x="705" y="528" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">18</text><text x="770" y="529" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO24</text><circle cx="575" cy="559" r="13" fill="#075b91"/><text x="575" y="564" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">19</text><text x="510" y="565" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO10 / MOSI</text><circle cx="705" cy="559" r="13" fill="#586976"/><text x="705" y="564" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">20</text><text x="770" y="565" font-size="17" fill="#586976" text-anchor="start" font-weight="normal">GND</text><circle cx="575" cy="595" r="13" fill="#075b91"/><text x="575" y="600" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">21</text><text x="510" y="601" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO9 / MISO</text><circle cx="705" cy="595" r="13" fill="#075b91"/><text x="705" y="600" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">22</text><text x="770" y="601" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO25</text><circle cx="575" cy="631" r="13" fill="#075b91"/><text x="575" y="636" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">23</text><text x="510" y="637" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO11 / SCLK</text><circle cx="705" cy="631" r="13" fill="#075b91"/><text x="705" y="636" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">24</text><text x="770" y="637" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO8 / CE0</text><circle cx="575" cy="667" r="13" fill="#586976"/><text x="575" y="672" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">25</text><text x="510" y="673" font-size="17" fill="#586976" text-anchor="end" font-weight="normal">GND</text><circle cx="705" cy="667" r="13" fill="#075b91"/><text x="705" y="672" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">26</text><text x="770" y="673" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO7 / CE1</text><circle cx="575" cy="703" r="13" fill="#075b91"/><text x="575" y="708" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">27</text><text x="510" y="709" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO0 / ID_SD</text><circle cx="705" cy="703" r="13" fill="#075b91"/><text x="705" y="708" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">28</text><text x="770" y="709" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO1 / ID_SC</text><circle cx="575" cy="739" r="13" fill="#075b91"/><text x="575" y="744" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">29</text><text x="510" y="745" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO5</text><circle cx="705" cy="739" r="13" fill="#586976"/><text x="705" y="744" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">30</text><text x="770" y="745" font-size="17" fill="#586976" text-anchor="start" font-weight="normal">GND</text><circle cx="575" cy="775" r="13" fill="#075b91"/><text x="575" y="780" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">31</text><text x="510" y="781" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO6</text><circle cx="705" cy="775" r="13" fill="#075b91"/><text x="705" y="780" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">32</text><text x="770" y="781" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO12</text><circle cx="575" cy="811" r="13" fill="#075b91"/><text x="575" y="816" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">33</text><text x="510" y="817" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO13</text><circle cx="705" cy="811" r="13" fill="#586976"/><text x="705" y="816" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">34</text><text x="770" y="817" font-size="17" fill="#586976" text-anchor="start" font-weight="normal">GND</text><circle cx="575" cy="847" r="13" fill="#075b91"/><text x="575" y="852" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">35</text><text x="510" y="853" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO19</text><circle cx="705" cy="847" r="13" fill="#075b91"/><text x="705" y="852" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">36</text><text x="770" y="853" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO16</text><circle cx="575" cy="883" r="13" fill="#075b91"/><text x="575" y="888" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">37</text><text x="510" y="889" font-size="17" fill="#075b91" text-anchor="end" font-weight="normal">GPIO26</text><circle cx="705" cy="883" r="13" fill="#075b91"/><text x="705" y="888" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">38</text><text x="770" y="889" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO20</text><circle cx="575" cy="919" r="13" fill="#586976"/><text x="575" y="924" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">39</text><text x="510" y="925" font-size="17" fill="#586976" text-anchor="end" font-weight="normal">GND</text><circle cx="705" cy="919" r="13" fill="#075b91"/><text x="705" y="924" font-size="13" fill="#fff" text-anchor="middle" font-weight="bold">40</text><text x="770" y="925" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO21</text><text x="40" y="1017" font-size="18" fill="#182c3a" text-anchor="start" font-weight="normal">Top view of the header. Identify pin 1 from the PCB marking before connecting anything.</text><text x="40" y="1052" font-size="18" fill="#b64336" text-anchor="start" font-weight="normal">GPIO uses 3.3V logic. Never feed 5V into a GPIO signal pin.</text><text x="40" y="1087" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">GPIO0 / GPIO1 are the HAT identification bus. Leave them unused in this build.</text></g></svg>
