<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-label="EyeCar / connection overview"><title>EyeCar / connection overview</title><defs><marker id="075b91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#075b91"/></marker><marker id="237f79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237f79"/></marker><marker id="b64336" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b64336"/></marker></defs><rect width="1280" height="1040" fill="#f6f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="32" fill="#075b91" text-anchor="start" font-weight="bold">EyeCar / connection overview</text><text x="40" y="90" font-size="18" fill="#182c3a" text-anchor="start" font-weight="normal">Blue and green: data or control. Red: regulated 5V. Ground is shared.</text><path d="M40 116H1240" stroke="#075b91" stroke-width="2"/><rect x="40" y="200" width="240" height="135" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="231" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">USB camera</text><text x="58" y="262" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">UVC video over USB</text><text x="58" y="287" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Single capture process</text><rect x="420" y="200" width="300" height="180" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="438" y="231" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Raspberry Pi 4</text><text x="438" y="262" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">ROS 2 Jazzy / Linux</text><text x="438" y="287" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">USB-A: camera and Mega</text><text x="438" y="312" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">GPIO18: strip data</text><text x="438" y="337" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">USB-C: regulated 5V input</text><rect x="880" y="200" width="340" height="160" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="898" y="231" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Mega + expansion board</text><text x="898" y="262" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">USB serial / 115200 baud</text><text x="898" y="287" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Firmware controls outputs</text><text x="898" y="312" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Sensor power: rated 5V rail</text><path d="M280 265H420" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><path d="M720 265H880" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><text x="748" y="245" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">USB serial</text><rect x="880" y="480" width="340" height="140" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="898" y="511" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Motor driver + servo</text><text x="898" y="542" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Motor signal: D3 / S3</text><text x="898" y="567" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Steering signal: D2 / S2</text><text x="898" y="592" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Keep the stock rated power path.</text><path d="M1050 360V480" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><text x="1070" y="430" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">Pulse signals</text><rect x="420" y="480" width="300" height="135" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="438" y="511" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">74AHCT125 buffer</text><text x="438" y="542" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Recommended for a 5V strip.</text><text x="438" y="567" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">VCC = 5V; GND and OE = GND.</text><text x="438" y="592" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">GPIO to A; Y to strip DIN.</text><path d="M570 380V480" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><text x="590" y="435" font-size="17" fill="#075b91" text-anchor="start" font-weight="normal">GPIO18 / pin 12</text><rect x="40" y="480" width="240" height="135" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="511" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">13-pixel LED strip</text><text x="58" y="542" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">5V and common GND</text><text x="58" y="567" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Signal connects to DIN.</text><text x="58" y="592" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Observe the data arrows.</text><path d="M420 545H280" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><text x="320" y="525" font-size="17" fill="#237f79" text-anchor="start" font-weight="normal">Data</text><rect x="40" y="730" width="240" height="135" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="761" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">5V supply / BEC</text><text x="58" y="792" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">BEC / power distribution</text><text x="58" y="817" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Check rating first.</text><text x="58" y="842" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">No raw battery voltage.</text><rect x="420" y="730" width="300" height="160" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="438" y="761" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">HC-SR04 / IR inputs</text><text x="438" y="792" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">4 HC-SR04 modules: 5V</text><text x="438" y="817" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">5 analog IR inputs</text><text x="438" y="842" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">IR power: check module rating.</text><text x="438" y="867" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">See the Mega signal map.</text><path d="M720 795H800V325H880" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><path d="M160 730V615" fill="none" stroke="#b64336" stroke-width="3" marker-end="url(#b64336)"/><path d="M280 795H330V410H500V380" fill="none" stroke="#b64336" stroke-width="3" marker-end="url(#b64336)"/><path d="M330 675H570V615" fill="none" stroke="#b64336" stroke-width="3" marker-end="url(#b64336)"/><path d="M330 795H420" fill="none" stroke="#b64336" stroke-width="3" marker-end="url(#b64336)"/><circle cx="330" cy="675" r="5" fill="#b64336"/><circle cx="330" cy="795" r="5" fill="#b64336"/><text x="350" y="708" font-size="17" fill="#b64336" text-anchor="start" font-weight="normal">Regulated 5V</text><path d="M40 924H1240" stroke="#586976" stroke-width="3"/><text x="40" y="954" font-size="19" fill="#182c3a" text-anchor="start" font-weight="normal">Common GND: Pi, Mega, sensors, LED supply and signal references.</text><text x="40" y="1000" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">The buffer is recommended, not confirmed installed. Battery / ESC / VIN routing needs a hardware check.</text></g></svg>
