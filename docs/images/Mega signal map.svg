<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-label="EyeCar / Mega signal map"><title>EyeCar / Mega signal map</title><defs><marker id="075b91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#075b91"/></marker><marker id="237f79" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#237f79"/></marker><marker id="b64336" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#b64336"/></marker></defs><rect width="1280" height="1080" fill="#f6f8fa"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="54" font-size="32" fill="#075b91" text-anchor="start" font-weight="bold">EyeCar / Mega signal map</text><text x="40" y="90" font-size="18" fill="#182c3a" text-anchor="start" font-weight="normal">Pin numbers are extracted from eyecar_base_controller.ino.</text><path d="M40 116H1240" stroke="#075b91" stroke-width="2"/><rect x="440" y="170" width="380" height="635" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="458" y="201" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Arduino Mega 2560</text><text x="458" y="232" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">USB: 115200 baud</text><rect x="40" y="230" width="290" height="110" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="261" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Motor driver / ESC</text><text x="58" y="292" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Signal input only</text><text x="58" y="317" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Power follows the ESC rating</text><rect x="40" y="390" width="290" height="110" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="58" y="421" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Steering servo</text><text x="58" y="452" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Signal input only</text><text x="58" y="477" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Keep its rated power supply</text><text x="465" y="290" font-size="22" fill="#075b91" text-anchor="start" font-weight="bold">D3 / S3</text><text x="465" y="450" font-size="22" fill="#075b91" text-anchor="start" font-weight="bold">D2 / S2</text><path d="M440 285H330" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><path d="M440 445H330" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><rect x="940" y="170" width="300" height="112" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="958" y="201" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">US1: rear</text><text x="958" y="232" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">HC-SR04</text><text x="958" y="257" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">+5V and GND required</text><text x="635" y="219" font-size="18" fill="#075b91" text-anchor="start" font-weight="normal">D5  TRIG</text><text x="635" y="252" font-size="18" fill="#237f79" text-anchor="start" font-weight="normal">D6  ECHO</text><path d="M820 215H940" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><path d="M940 248H820" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><rect x="940" y="315" width="300" height="112" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="958" y="346" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">US2: right</text><text x="958" y="377" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">HC-SR04</text><text x="958" y="402" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">+5V and GND required</text><text x="635" y="364" font-size="18" fill="#075b91" text-anchor="start" font-weight="normal">D7  TRIG</text><text x="635" y="397" font-size="18" fill="#237f79" text-anchor="start" font-weight="normal">D8  ECHO</text><path d="M820 360H940" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><path d="M940 393H820" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><rect x="940" y="460" width="300" height="112" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="958" y="491" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">US3: left</text><text x="958" y="522" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">HC-SR04</text><text x="958" y="547" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">+5V and GND required</text><text x="635" y="509" font-size="18" fill="#075b91" text-anchor="start" font-weight="normal">D10  TRIG</text><text x="635" y="542" font-size="18" fill="#237f79" text-anchor="start" font-weight="normal">D11  ECHO</text><path d="M820 505H940" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><path d="M940 538H820" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><rect x="940" y="605" width="300" height="112" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="958" y="636" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">US4: front</text><text x="958" y="667" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">HC-SR04</text><text x="958" y="692" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">+5V and GND required</text><text x="635" y="654" font-size="18" fill="#075b91" text-anchor="start" font-weight="normal">D12  TRIG</text><text x="635" y="687" font-size="18" fill="#237f79" text-anchor="start" font-weight="normal">D13  ECHO</text><path d="M820 650H940" fill="none" stroke="#075b91" stroke-width="3" marker-end="url(#075b91)"/><path d="M940 683H820" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><text x="465" y="745" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">Analog inputs</text><text x="465" y="778" font-size="21" fill="#182c3a" text-anchor="start" font-weight="normal">A0 / A1 / A2 / A3 / A4</text><rect x="350" y="860" width="580" height="110" rx="5" fill="#fff" stroke="#b6c5cc" stroke-width="2"/><text x="368" y="891" font-size="20" fill="#075b91" text-anchor="start" font-weight="bold">5 IR channels</text><text x="368" y="922" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Module AO outputs to A0-A4 in connector order.</text><text x="368" y="947" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Firmware reads raw ADC values from 0 to 1023.</text><path d="M640 860V805" fill="none" stroke="#237f79" stroke-width="3" marker-end="url(#237f79)"/><text x="40" y="1015" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Signal map, not a physical header layout. S2/S3 mean the shield signal row.</text><text x="40" y="1047" font-size="17" fill="#182c3a" text-anchor="start" font-weight="normal">Sensor direction follows the project mapping; verify each channel on the actual rover.</text></g></svg>
