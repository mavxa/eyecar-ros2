services:
  ros2:
    image: eyecar-ros2:jazzy
    container_name: eyecar-ros2
    pull_policy: never
    init: true
    network_mode: host
    working_dir: /workspace
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      CYCLONEDDS_URI: file:///workspace/deploy/dds/laptop.xml
      EYECAR_RVIZ_DIRECT: "1"
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/eyecar.xauth
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - .:/workspace
      - zed-server:/home/ubuntu/.zed_server
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - type: bind
        source: ${XAUTHORITY:-/dev/null}
        target: /tmp/eyecar.xauth
        read_only: true
        bind:
          create_host_path: false

volumes:
  zed-server:
