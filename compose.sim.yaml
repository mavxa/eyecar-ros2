name: eyecar-sim
services:
  sim:
    image: ${EYECAR_SIM_IMAGE:-eyecar-webots:jazzy}
    container_name: eyecar-sim
    pull_policy: never
    init: true
    network_mode: host
    working_dir: /workspace
    environment:
      USER: ubuntu
      ROS_DOMAIN_ID: "42"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/eyecar.xauth
      LIBGL_ALWAYS_SOFTWARE: "1"
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - type: bind
        source: ${XAUTHORITY:-/dev/null}
        target: /tmp/eyecar.xauth
        read_only: true
        bind:
          create_host_path: false
